name: Windows

on:
  push:
    tags: ["v*-windows*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Fetch the Xray Windows core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor/xray | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" `
            -OutFile "$env:TEMP/Xray-windows-64.zip"
          Expand-Archive -Path "$env:TEMP/Xray-windows-64.zip" -DestinationPath vendor/xray -Force

      - name: Unit tests
        run: python -m pytest tests -q

      - name: Build the executable
        run: |
          python tools/make_icon.py
          python -m PyInstaller schnellvpn.spec --noconfirm

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/SchnellVPN.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SchnellVPN.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SchnellVPN-windows
          path: |
            windows/dist/SchnellVPN.exe
            windows/dist/SHA256SUMS.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body: |
            **SchnellVPN for Windows — ${{ github.ref_name }}**

            Single-file Windows x64 build (Python + PySide6, bundled Xray-core).
            Download `SchnellVPN.exe`, run it, and import a subscription or link.
            The app checks this same release feed for updates.

            Android (stable) is released beside it:
            https://github.com/A-z-exe/SchnellVPN/releases/latest

            This is a pre-release, so the Android release stays the "Latest" download.
          files: |
            windows/dist/SchnellVPN.exe
            windows/dist/SHA256SUMS.txt
