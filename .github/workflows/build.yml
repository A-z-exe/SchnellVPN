name: Build SchnellVPN APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  LIBV2RAY_VERSION: v26.8.20
  # بعد از اولین build موفق، هش چاپ‌شده در summary رو اینجا بذار تا هر تغییر آپ‌استریمی build رو fail کنه:
  LIBV2RAY_SHA256: ""
  # hev-socks5-tunnel باید روی یک commit ثابت باشه: امضای JNI (TProxyStartService ... ) بین نسخه‌ها عوض می‌شه
  # و عدم تطابق = SIGABRT موقع لود. (commit بررسی‌شده؛ همراه با hev/htproxy/TProxyService.kt)
  HEV_REF: 069c3ee263cf9ec7273ea87dc08f45f443fc3e28

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
             packages: platform-tools

      - name: Install Android NDK 26
        run: sdkmanager --install "ndk;26.3.11579264"

      - name: Download libv2ray.aar (pinned)
        run: |
          mkdir -p app/libs
          curl -fL -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${LIBV2RAY_VERSION}/libv2ray.aar"
          ls -lh app/libs/libv2ray.aar
          ACTUAL=$(sha256sum app/libs/libv2ray.aar | cut -d' ' -f1)
          echo "libv2ray ${LIBV2RAY_VERSION} sha256: ${ACTUAL}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${LIBV2RAY_SHA256}" ]; then
            if [ "${ACTUAL}" != "${LIBV2RAY_SHA256}" ]; then
              echo "::error::libv2ray.aar checksum mismatch! File changed upstream."
              exit 1
            fi
          fi

      - name: Fetch hev-socks5-tunnel (pinned)
        run: |
          git clone https://github.com/heiher/hev-socks5-tunnel app/src/main/jni/hev-socks5-tunnel
          cd app/src/main/jni/hev-socks5-tunnel
          git checkout "${HEV_REF}"
          git submodule update --init --recursive --depth 1
          echo "hev-socks5-tunnel @ $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          ./gradlew assembleDebug --stacktrace

      - name: Verify native libs are inside the APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          unzip -l "$APK" | grep -E "libhev-socks5-tunnel\.so|libgojni\.so" | tee /tmp/libs.txt
          grep -q "libhev-socks5-tunnel.so" /tmp/libs.txt || { echo "::error::hev native lib missing from APK"; exit 1; }
          grep -q "libgojni.so" /tmp/libs.txt || { echo "::error::libv2ray (gojni) missing from APK"; exit 1; }

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SchnellVPN-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
