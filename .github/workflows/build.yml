name: Build SchnellVPN APK

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  LIBV2RAY_VERSION: v26.8.20
  # بعد از اولین build موفق، هش چاپ‌شده در summary رو اینجا بذار تا هر تغییر آپ‌استریمی build رو fail کنه:
  LIBV2RAY_SHA256: ""
  # hev-socks5-tunnel باید روی یک commit ثابت باشه: امضای JNI (TProxyStartService ... ) بین نسخه‌ها عوض می‌شه
  # و عدم تطابق = SIGABRT موقع لود. (commit بررسی‌شده؛ همراه با hev/htproxy/TProxyService.kt)
  HEV_REF: 069c3ee263cf9ec7273ea87dc08f45f443fc3e28

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
             packages: platform-tools

      - name: Install Android NDK 26
        run: sdkmanager --install "ndk;26.3.11579264"

      - name: Download libv2ray.aar (pinned)
        run: |
          mkdir -p app/libs
          curl -fL -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${LIBV2RAY_VERSION}/libv2ray.aar"
          ls -lh app/libs/libv2ray.aar
          ACTUAL=$(sha256sum app/libs/libv2ray.aar | cut -d' ' -f1)
          echo "libv2ray ${LIBV2RAY_VERSION} sha256: ${ACTUAL}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${LIBV2RAY_SHA256}" ]; then
            if [ "${ACTUAL}" != "${LIBV2RAY_SHA256}" ]; then
              echo "::error::libv2ray.aar checksum mismatch! File changed upstream."
              exit 1
            fi
          fi

      - name: Fetch hev-socks5-tunnel (pinned)
        run: |
          git clone https://github.com/heiher/hev-socks5-tunnel app/src/main/jni/hev-socks5-tunnel
          cd app/src/main/jni/hev-socks5-tunnel
          git checkout "${HEV_REF}"
          git submodule update --init --recursive --depth 1
          echo "hev-socks5-tunnel @ $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Decode release keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            mkdir -p "$RUNNER_TEMP/signing"
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/signing/release.p12"
            ls -l "$RUNNER_TEMP/signing/release.p12"
          else
            echo "No release keystore secret; release build will use debug signing"
          fi

      - name: Unit tests
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Require a signed build for tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: test -n "$KS" || { echo "::error::Refusing to publish a debug-signed APK"; exit 1; }

      - name: Build release APK
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/signing/release.p12
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          ./gradlew assembleRelease --stacktrace

      - name: Verify native libs are inside every APK
        run: |
          for APK in app/build/outputs/apk/release/*.apk; do
            echo "== $APK"
            unzip -l "$APK" | grep -E "libhev-socks5-tunnel\.so|libgojni\.so" || true
            H=$(unzip -l "$APK" | grep -c "libhev-socks5-tunnel.so" || true)
            G=$(unzip -l "$APK" | grep -c "libgojni.so" || true)
            [ "${H:-0}" -ge 1 ] || { echo "::error::hev native lib missing from $APK"; exit 1; }
            [ "${G:-0}" -ge 1 ] || { echo "::error::libv2ray (gojni) missing from $APK"; exit 1; }
          done

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SchnellVPN-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Name the APKs for the release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          : > SHA256SUMS-Android.txt
          for APK in app/build/outputs/apk/release/*.apk; do
            ABI=$(basename "$APK" | grep -oE '(arm64-v8a|armeabi-v7a|x86_64|x86)' | head -1)
            if [ -z "$ABI" ]; then echo "::error::cannot read ABI from $APK"; exit 1; fi
            OUT="SchnellVPN-${VERSION}-${ABI}.apk"
            cp "$APK" "$OUT"
            sha256sum "$OUT" >> SHA256SUMS-Android.txt
          done
          cat SHA256SUMS-Android.txt

      # This job creates the joint release; the Windows and Linux jobs wait for it
      # and upload their assets into the same release.
      - name: Create the joint release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "SchnellVPN ${{ github.ref_name }}"
          prerelease: false
          body: |
            **SchnellVPN ${{ github.ref_name }} — Android · Windows · Linux**

            - **Android 8–17:** one APK per ABI — `SchnellVPN-*-arm64-v8a.apk` (most phones),
              `*-armeabi-v7a.apk` (old 32-bit phones), `*-x86_64.apk` (emulators)
            - **Windows 10/11:** `SchnellVPN.exe`
            - **Windows 7/8/8.1:** `SchnellVPN-Win7.exe`
            - **Linux:** `.deb` package and portable `.AppImage`

            SHA-256 checksums: `SHA256SUMS*.txt`. The desktop apps update themselves
            from this release; the Android app checks `/releases/latest`.
          files: |
            SchnellVPN-*.apk
            SHA256SUMS-Android.txt
