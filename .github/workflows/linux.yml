name: Linux

on:
  push:
    tags: ["v*"]
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: linux/requirements.txt

      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libdbus-1-3 libfontconfig1 libfuse2 unzip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Unit tests (shared client)
        working-directory: ${{ github.workspace }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Build binary, .deb and AppImage
        run: ./build.sh

      - name: Checksums
        run: |
          cd dist
          sha256sum SchnellVPN SchnellVPN_*_amd64.deb SchnellVPN-*-x86_64.AppImage \
            | sed 's#  .*/#  #' > SHA256SUMS-Linux.txt
          cat SHA256SUMS-Linux.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SchnellVPN-linux
          path: |
            linux/dist/SchnellVPN
            linux/dist/SchnellVPN_*_amd64.deb
            linux/dist/SchnellVPN-*-x86_64.AppImage
            linux/dist/SHA256SUMS-Linux.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Android job creates the release; wait for it so all assets share one release.
          for i in $(seq 1 120); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" \
                dist/SchnellVPN_*_amd64.deb \
                dist/SchnellVPN-*-x86_64.AppImage \
                dist/SHA256SUMS-Linux.txt --clobber
              exit 0
            fi
            sleep 15
          done
          echo "::error::release $GITHUB_REF_NAME was not created by the Android job"
          exit 1
